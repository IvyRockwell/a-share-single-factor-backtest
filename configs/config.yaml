# A 股单因子选股与回测研究系统配置
# 全部研究假设与参数来源。

project:
  name: A-Share Single-Factor Stock Selection & Backtesting System
  version: v1

data:
  source: CSMAR
  raw_dir: 项目初始数据
  processed_dir: data/processed
  start_date: 2014-09-12
  end_date: 2025-12-31
  strategy_return_field: Dretwd
  momentum_price_field: Adjprcwd
  strategy_return_unit: decimal
  momentum_price_adjustment: cash_dividend_reinvestment

benchmark:
  name: CSI 300
  code: H00300
  close_field: Idxtrd05
  return_field: Idxtrd08
  return_unit: percent

factors:
  # 主因子 12-1；6-1 与 1M 反转作为并列变体，不进入主组合。
  momentum_lookback_months: 12
  momentum_skip_months: 1
  momentum_variants:
    - {name: momentum_6_1, lookback_months: 6, skip_months: 1, higher_is_better: true}
    - {name: momentum_1m, lookback_months: 1, skip_months: 0, higher_is_better: false}
  quantile_groups: 5
  value_metric: disclosure_timed_pe   # 披露日 TTM 净利润 ÷ 总市值
  value_metric_vendor: PE1TTM          # 供应商字段，仅作逐月对照
  quality_metric: ROE
  pe_availability_assumption: disclosure_date

factor_test:
  future_return_start: next_trading_day
  future_return_end: next_signal_date_close
  min_ic_pairs: 50
  retain_extreme_returns: true
  # 子区间按 A 股风格划分，需覆盖整个样本且互不重叠。
  subperiods:
    - { name: 2014-2016, start: 2014-09-01, end: 2016-12-31 }
    - { name: 2017-2019, start: 2017-01-01, end: 2019-12-31 }
    - { name: 2020-2022, start: 2020-01-01, end: 2022-12-31 }
    - { name: 2023-2025, start: 2023-01-01, end: 2025-12-31 }

portfolio:
  rebalance_frequency: monthly
  selection_quantile: 0.2
  weighting: equal
  selection_tie_policy: preserve_boundary_ties
  execution: next_trading_day_open
  execution_availability: normal_trading_status_and_valid_open_price

universe:
  markets: [1, 4, 16, 32]
  min_listing_months: 6
  normal_trading_status: "1"

neutralization:
  # 中性化控制变量：log(总市值) + 行业哑变量。行业覆盖不足时自动降级为纯市值。
  enabled: true
  industry_standard: P0207   # 证监会2012版；申万2021版为 P0218
  min_group_size: 20
  min_industry_coverage: 0.80

costs:
  # 成本假设。所有比例均按单边实际成交金额计算。
  commission_rate: 0.0003
  commission_source: research_assumption
  minimum_commission: 5.0
  stamp_duty_rates:
    - start_date: 2014-01-01
      sell_rate: 0.001
    - start_date: 2023-08-28
      sell_rate: 0.0005
  stamp_duty_source: https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/200809/t20080919_76432.htm; https://shanxi.chinatax.gov.cn/web/detail/sx-11400-545-1780448
  slippage_scenarios_bp: [0, 10, 20]
  slippage_source: research_assumption

research:
  annualization_days: 252
  risk_free_rate: 0.0
  initial_capital: 100000000

capacity:
  # 单票目标权重 <= 信号日 N 日 ADV × adv_fraction / 初始资金；超出部分留现金。
  adv_window: 20
  adv_fraction: 0.05
  min_adv_periods: 10

attribution:
  annualization_months: 12
  min_months: 24
  min_cap_coverage: 0.80
  long_short_score_types: [raw, neutral]

robustness:
  selection_quantiles: [0.1, 0.2, 0.3]
  rebalance_frequencies: [monthly, quarterly]
  quarterly_signal_months: [3, 6, 9, 12]
