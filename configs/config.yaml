# A 股单因子选股与回测研究系统基础配置
# 尚未确认的研究假设使用 null，确认后再填写，不在初始化阶段擅自决定。

project:
  name: A-Share Single-Factor Stock Selection & Backtesting System
  version: v1

data:
  source: CSMAR
  raw_dir: 项目初始数据
  processed_dir: data/processed
  start_date: 2014-09-12
  end_date: 2025-12-31
  strategy_return_field: Dretwd
  momentum_price_field: Adjprcwd
  strategy_return_unit: decimal
  momentum_price_adjustment: cash_dividend_reinvestment

benchmark:
  name: CSI 300
  code: H00300
  close_field: Idxtrd05
  return_field: Idxtrd08
  return_unit: percent

factors:
  momentum_lookback_months: 6
  quantile_groups: 5
  value_metric: PE1TTM
  quality_metric: ROE
  pe_availability_assumption: trading_date

portfolio:
  rebalance_frequency: monthly
  selection_quantile: 0.2
  weighting: equal
  execution: next_trading_day

costs:
  commission_rate: null
  stamp_duty_rate: null
  slippage_rate: null

research:
  annualization_days: 252
  risk_free_rate: null
